# SonarQube Project Configuration
sonar.projectKey=cognitive-anomaly-detector
sonar.projectName=cognitive-anomaly-detector
sonar.projectVersion=1.0
sonar.login=admin
sonar.password=patilla1

# Path to source and test directories
sonar.sources=src
sonar.tests=tests

# Language and encoding
sonar.language=py
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Coverage Report (pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**, **/.venv/**, **/tests/**, data/**, models/**
sonar.test.inclusions=tests/test_*.py
